name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Built frontend must be committed (production has no Node)
        run: |
          git add -N backend/inkwell/static_app
          git diff --exit-code --stat backend/inkwell/static_app || { echo "::error::backend/inkwell/static_app is out of date. Run 'npm run build' and commit it."; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Django tests
        working-directory: backend
        run: python manage.py test
      - name: Package deploy zip
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with: { name: inkwell-deploy, path: inkwell-deploy.zip }
