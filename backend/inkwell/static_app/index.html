  <title>Inkwell</title>
  <script>
    // set theme before first paint to avoid a flash
    try {
      var s = JSON.parse(localStorage.getItem('inkwell:boot') || '{}');
      var t = s.theme || 'system', r = document.documentElement;
      r.setAttribute('data-theme', t);
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = dark ? '#000000' : t === 'sepia' ? '#F1E7D0' : '#F2F2F7';
      if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
    } catch (e) {}
  </script>
  <style>
    #splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#F2F2F7;transition:opacity .35s ease,transform .35s ease}
    html[data-theme="dark"] #splash{background:#000}
    @media (prefers-color-scheme:dark){html[data-theme="system"] #splash{background:#000}}
    #splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
    #splash .lg{width:72px;height:72px;border-radius:20px;background:#FF9F0A;display:grid;place-items:center;box-shadow:0 12px 30px rgba(255,159,10,.4);animation:sp .7s cubic-bezier(.2,.9,.3,1.3) both}
    @keyframes sp{from{transform:scale(.6) rotate(-12deg);opacity:0}}
  </style>
